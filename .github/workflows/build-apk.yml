name: Build APK From Uploaded ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Extract the ZIP you uploaded to the repo
      - name: Extract Project ZIP
        run: |
          mkdir project

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Gradle because wrapper is missing
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: project
        run: gradle wrapper

      - name: Grant Execute Permission
        working-directory: project
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            project/app/build/outputs/apk/debug/*.apk
