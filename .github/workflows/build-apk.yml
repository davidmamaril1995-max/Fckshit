name: Build APK From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP Files
        run: |
          mkdir -p extracted

          shopt -s nullglob
          FILES=(*.zip)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No ZIP files found in repository."
            exit 1
          fi

          for file in "${FILES[@]}"; do
            echo "Extracting $file"
            unzip -oq "$file" -d extracted
          done

      - name: Show Extracted Files
        run: |
          echo "===== Directory Tree ====="
          find extracted

      - name: Detect Android Project
        run: |
          PROJECT=$(find extracted \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Project Directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Copy Keystore
        run: |
          cp debug.keystore "${PROJECT_DIR}/"

      - name: Generate Gradle Wrapper If Missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper
          fi

      - name: Make gradlew Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "Searching for APK..."
          find extracted -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: extracted/**/*.apk
